<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b1220">
<title>Nexus AI</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#eef4f3;
  color:#101827;
}
header{
  padding:20px;
  background:#0b1220;
  color:white;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.logo{
  display:flex;
  align-items:center;
  gap:12px;
  font-size:22px;
  font-weight:bold;
}
.bot{
  width:42px;
  height:42px;
  border-radius:14px;
  background:#20c9e8;
  display:grid;
  place-items:center;
  color:#07111d;
  font-size:23px;
}
main{
  max-width:900px;
  margin:auto;
  padding:25px 16px 120px;
}
.hero{
  background:linear-gradient(135deg,#102033,#193b50);
  color:white;
  border-radius:28px;
  padding:35px 25px;
  margin-bottom:20px;
}
.hero h1{
  font-size:38px;
  margin:10px 0;
}
.hero p{
  color:#cbd7df;
  line-height:1.6;
}
.chat{
  background:white;
  border-radius:25px;
  padding:20px;
  min-height:430px;
  box-shadow:0 8px 30px #0001;
}
.messages{
  min-height:330px;
}
.welcome{
  text-align:center;
  padding:70px 15px;
  color:#667085;
}
.message{
  padding:13px 16px;
  border-radius:18px;
  margin:10px 0;
  max-width:85%;
  line-height:1.5;
}
.user{
  background:#d9f7ff;
  margin-left:auto;
}
.ai{
  background:#f0f3f5;
}
.input-area{
  display:flex;
  gap:10px;
  margin-top:15px;
}
input{
  flex:1;
  padding:16px;
  border:1px solid #d7dde2;
  border-radius:18px;
  font-size:16px;
  outline:none;
}
button{
  border:0;
  border-radius:18px;
  padding:0 22px;
  background:#20c9e8;
  color:#07111d;
  font-weight:bold;
  font-size:16px;
}
button:active{transform:scale(.97)}
.nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:white;
  border-top:1px solid #ddd;
  display:flex;
  justify-content:space-around;
  padding:12px;
}
.nav div{
  text-align:center;
  font-size:12px;
  color:#667085;
}
</style>
</head>

<body>

<header>
  <div class="logo">
    <div class="bot">🤖</div>
    Nexus AI
  </div>
  <div>☰</div>
</header>

<main>

<section class="hero">
  <small>NEXUS AI HUB</small>
  <h1>Your AI. One place.</h1>
  <p>
    Chat, create, explore and build with your personal AI workspace.
  </p>
</section>

<section class="chat">

<div id="messages" class="messages">
  <div class="welcome">
    <h2>👋 Welcome to Nexus AI</h2>
    <p>Ask me anything to get started.</p>
  </div>
</div>

<div class="input-area">
  <input
    id="prompt"
    type="text"
    placeholder="Ask Nexus AI..."
    autocomplete="off"
  >
  <button onclick="sendMessage()">Send</button>
</div>

</section>

</main>

<nav class="nav">
  <div>🏠<br>Home</div>
  <div>💬<br>Chat</div>
  <div>✨<br>Create</div>
  <div>🧪<br>Lab</div>
  <div>⚙️<br>Settings</div>
</nav>

<script>
const input = document.getElementById("prompt");
const messages = document.getElementById("messages");

input.addEventListener("keydown", function(e){
  if(e.key === "Enter") sendMessage();
});

function sendMessage(){
  const text = input.value.trim();
  if(!text) return;

  const welcome = document.querySelector(".welcome");
  if(welcome) welcome.remove();

  const user = document.createElement("div");
  user.className = "message user";
  user.textContent = text;
  messages.appendChild(user);

  input.value = "";

  const ai = document.createElement("div");
  ai.className = "message ai";
  ai.textContent = "Nexus AI is ready. 🤖 AI connection will be added next.";
  messages.appendChild(ai);

  messages.scrollTop = messages.scrollHeight;
}
</script>

</body>
</html>
